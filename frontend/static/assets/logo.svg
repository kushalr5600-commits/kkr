<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BLACKBOX logo">
  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1218"/>
      <stop offset="100%" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="glowEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="50%" stop-color="#2f8fff"/>
      <stop offset="100%" stop-color="#0a4fd8"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a6bff"/>
      <stop offset="100%" stop-color="#5eb8ff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edgeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cube faces -->
  <polygon points="256,72 392,148 256,224 120,148" fill="url(#cubeTop)" stroke="#2a3548" stroke-width="1.5"/>
  <polygon points="120,148 256,224 256,392 120,316" fill="url(#cubeLeft)" stroke="#1a2433" stroke-width="1"/>
  <polygon points="392,148 256,224 256,392 392,316" fill="url(#cubeRight)" stroke="#152030" stroke-width="1"/>

  <!-- Vertical glowing edge -->
  <line x1="256" y1="224" x2="256" y2="392" stroke="url(#glowEdge)" stroke-width="4" filter="url(#edgeGlow)" stroke-linecap="round"/>
  <!-- Top edges glow -->
  <polyline points="120,148 256,72 392,148 256,224" fill="none" stroke="#6eb6ff" stroke-width="2" opacity="0.9" filter="url(#softGlow)"/>
  <line x1="256" y1="72" x2="256" y2="224" stroke="#3d8bfd" stroke-width="1.5" opacity="0.55"/>

  <!-- Signal bars on right face -->
  <g filter="url(#softGlow)">
    <rect x="286" y="268" width="10" height="28" rx="5" fill="url(#barBlue)"/>
    <rect x="306" y="248" width="10" height="48" rx="5" fill="url(#barBlue)"/>
    <rect x="326" y="228" width="10" height="68" rx="5" fill="url(#barBlue)"/>
    <rect x="346" y="208" width="10" height="88" rx="5" fill="url(#barBlue)"/>
  </g>

  <!-- Soft under-glow -->
  <ellipse cx="256" cy="410" rx="70" ry="12" fill="#1a5cff" opacity="0.18" filter="url(#softGlow)"/>
</svg>
